<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>My Cart | VyapaarX</title>

  <link rel="stylesheet" href="style.css">

  <style>

    .cart-layout {
      display: grid;
      grid-template-columns: 1fr 350px;
      gap: 20px;
      align-items: start;
    }

    .cart-item {
      display: flex;
      gap: 20px;
      background: #fff;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    .cart-image {
      width: 130px;
      height: 130px;
      object-fit: contain;
      border: 1px solid #eee;
      border-radius: 8px;
      background: #fff;
    }

    .cart-info {
      flex: 1;
    }

    .cart-info h3 {
      margin-top: 0;
    }

    .cart-price {
      font-size: 22px;
      font-weight: bold;
      margin: 10px 0;
    }

    .qty {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 15px;
    }

    .qty button {
      width: 35px;
      height: 35px;
      border: 1px solid #ccc;
      background: white;
      border-radius: 5px;
      font-size: 20px;
      cursor: pointer;
    }

    .qty span {
      min-width: 30px;
      text-align: center;
      font-weight: bold;
    }

    .remove {
      color: #d00;
      background: none;
      border: none;
      cursor: pointer;
      margin-top: 12px;
      font-weight: bold;
    }

    .summary {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
      position: sticky;
      top: 20px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin: 12px 0;
    }

    .grand-total {
      font-size: 24px;
      font-weight: bold;
      border-top: 1px solid #ddd;
      padding-top: 15px;
      margin-top: 15px;
    }

    .empty-cart {
      text-align: center;
      background: #fff;
      padding: 60px 20px;
      border-radius: 10px;
    }

    @media(max-width:800px) {

      .cart-layout {
        grid-template-columns: 1fr;
      }

      .summary {
        position: static;
      }

    }

    @media(max-width:600px) {

      .cart-item {
        flex-direction: column;
      }

      .cart-image {
        width: 100%;
        height: 220px;
      }

    }

  </style>

</head>


<body>


<header>

  <a class="brand" href="/">

    Vyapaar<span>X</span>

    <small>
      Business Connect. Trade. Grow.
    </small>

  </a>


  <nav>

    <a href="/">
      Home
    </a>

    <a href="/products.html">
      Products
    </a>

    <a href="/cart.html">
      🛒 Cart
      <span id="cartCount">0</span>
    </a>

    <a href="/seller.html">
      Sell
    </a>

  </nav>

</header>



<main class="page">

  <h1>
    🛒 My Cart
  </h1>


  <div
    id="cartContainer"
    class="cart-layout"
  >

  </div>

</main>



<footer>

  © 2026 VyapaarX

</footer>



<script>

/* =========================
   GET CART
========================= */

function getCart() {

  try {

    return JSON.parse(
      localStorage.getItem("vxCart") || "[]"
    );

  } catch (e) {

    return [];

  }

}


/* =========================
   SAVE CART
========================= */

function saveCart(cart) {

  localStorage.setItem(
    "vxCart",
    JSON.stringify(cart)
  );

}


/* =========================
   CART COUNT
========================= */

function updateCartCount() {

  const cart = getCart();

  const count =
    cart.reduce(
      (total, item) =>
        total + Number(item.quantity || 1),
      0
    );

  const el =
    document.getElementById("cartCount");

  if (el) {

    el.textContent = count;

  }

}


/* =========================
   RENDER CART
========================= */

function renderCart() {

  const container =
    document.getElementById(
      "cartContainer"
    );


  const cart = getCart();


  updateCartCount();


  if (cart.length === 0) {

    container.innerHTML = `

      <div
        class="empty-cart"
        style="grid-column:1/-1"
      >

        <div
          style="
            font-size:70px;
            margin-bottom:20px;
          "
        >
          🛒
        </div>

        <h2>
          Your cart is empty
        </h2>

        <p>
          Add products to your cart
          and they will appear here.
        </p>

        <a
          href="/products.html"
          class="btn blue"
        >
          Continue Shopping
        </a>

      </div>

    `;

    return;

  }


  let subtotal = 0;


  let itemsHTML = "";


  cart.forEach(
    (item, index) => {

      const quantity =
        Number(item.quantity || 1);


      const price =
        Number(item.price || 0);


      const itemTotal =
        price * quantity;


      subtotal += itemTotal;


      const image =
        item.image ||

        (
          item.images &&
          item.images.length > 0
            ? item.images[0]
            : ""
        );


      itemsHTML += `

        <div class="cart-item">

          ${
            image

              ? `

                <img
                  src="${image}"
                  class="cart-image"
                  alt="${item.name}"
                >

              `

              : `

                <div
                  class="cart-image"
                  style="
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    font-size:60px;
                  "
                >
                  🛍️
                </div>

              `
          }


          <div class="cart-info">

            <h3>
              ${item.name}
            </h3>


            <p>
              Seller:
              <strong>
                ${
                  item.business_name ||
                  "VyapaarX Seller"
                }
              </strong>
            </p>


            <div class="cart-price">

              ₹${price.toFixed(2)}

              <small>
                ${item.unit || "/ Piece"}
              </small>

            </div>


            <div class="qty">

              <button
                onclick="changeQuantity(${index}, -1)"
              >
                −
              </button>


              <span>
                ${quantity}
              </span>


              <button
                onclick="changeQuantity(${index}, 1)"
              >
                +
              </button>

            </div>


            <p>

              Item Total:

              <strong>
                ₹${itemTotal.toFixed(2)}
              </strong>

            </p>


            <button
              class="remove"
              onclick="removeItem(${index})"
            >

              ❌ Remove

            </button>

          </div>

        </div>

      `;

    }
  );


  const delivery =
    subtotal >= 500
      ? 0
      : 40;


  const grandTotal =
    subtotal + delivery;


  container.innerHTML = `

    <div>

      ${itemsHTML}

    </div>


    <div class="summary">

      <h2>
        Price Details
      </h2>


      <div class="summary-row">

        <span>
          Items
        </span>

        <span>
          ${cart.length}
        </span>

      </div>


      <div class="summary-row">

        <span>
          Subtotal
        </span>

        <strong>
          ₹${subtotal.toFixed(2)}
        </strong>

      </div>


      <div class="summary-row">

        <span>
          Delivery
        </span>

        <strong>

          ${
            delivery === 0
              ? "FREE"
              : "₹" + delivery
          }

        </strong>

      </div>


      <div
        class="grand-total"
      >

        <div class="summary-row">

          <span>
            Total
          </span>

          <span>
            ₹${grandTotal.toFixed(2)}
          </span>

        </div>

      </div>


      <button
        class="btn green"
        style="
          width:100%;
          margin-top:15px;
          font-size:18px;
        "
        onclick="proceedToBuy()"
      >

        ⚡ Proceed to Buy

      </button>


      <a
        href="/products.html"
        class="btn blue"
        style="
          display:block;
          text-align:center;
          margin-top:10px;
        "
      >

        Continue Shopping

      </a>

    </div>

  `;

}


/* =========================
   CHANGE QUANTITY
========================= */

function changeQuantity(index, change) {

  const cart = getCart();


  if (!cart[index]) return;


  cart[index].quantity =
    Number(cart[index].quantity || 1)
    + change;


  if (cart[index].quantity <= 0) {

    cart.splice(index, 1);

  }


  saveCart(cart);

  renderCart();

}


/* =========================
   REMOVE ITEM
========================= */

function removeItem(index) {

  const cart = getCart();


  if (!cart[index]) return;


  const confirmRemove =
    confirm(
      "Remove this product from cart?"
    );


  if (!confirmRemove) return;


  cart.splice(index, 1);


  saveCart(cart);

  renderCart();

}


/* =========================
   PROCEED TO BUY
========================= */

function proceedToBuy() {

  const cart = getCart();


  if (cart.length === 0) {

    alert(
      "Your cart is empty."
    );

    return;

  }


  window.location.href =
    "/checkout.html";

}


/* =========================
   PAGE LOAD
========================= */

document.addEventListener(
  "DOMContentLoaded",
  function () {

    renderCart();

  }
);

</script>


</body>

</html>

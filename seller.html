<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sell on VyapaarX</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .seller-page {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
    }

    .box {
      background: #fff;
      padding: 25px;
      margin-bottom: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    .box h2 {
      margin-top: 0;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 7px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 7px;
      font-size: 15px;
    }

    .form-group textarea {
      min-height: 100px;
      resize: vertical;
    }

    .btn {
      background: #2874f0;
      color: white;
      border: 0;
      padding: 13px 22px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
    }

    .btn:hover {
      background: #1257c7;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 7px;
      display: none;
    }

    .success {
      background: #e8f5e9;
      color: #1b5e20;
    }

    .error {
      background: #ffebee;
      color: #b71c1c;
    }

    .photo-info {
      margin-top: 7px;
      font-size: 13px;
      color: #666;
    }

    #selectedPhotos {
      margin-top: 10px;
      font-size: 14px;
      color: #333;
    }

    @media (max-width: 600px) {
      .seller-page {
        padding: 12px;
        margin: 15px auto;
      }

      .box {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

<header>
  <a class="brand" href="/">
    Vyapaar<span>X</span>
    <small>Business Connect. Trade. Grow.</small>
  </a>

  <nav>
    <a href="/">Home</a>
    <a href="/products.html">Products</a>
    <a href="/seller.html">Sell</a>
  </nav>
</header>


<main class="seller-page">

  <!-- SELLER REGISTRATION -->
  <section class="box">

    <h2>Become a Seller</h2>

    <form id="sellerForm">

      <div class="form-group">
        <label for="businessName">Business Name</label>

        <input
          type="text"
          id="businessName"
          required
          placeholder="Enter business name"
        >
      </div>


      <div class="form-group">
        <label for="sellerCategory">Business Category</label>

        <select id="sellerCategory" required>

          <option value="">Select Category</option>

          <option value="Water & Beverage">
            Water & Beverage
          </option>

          <option value="Plastic">
            Plastic
          </option>

          <option value="Clothing">
            Clothing
          </option>

          <option value="Electronics">
            Electronics
          </option>

          <option value="Food">
            Food
          </option>

          <option value="Other">
            Other
          </option>

        </select>
      </div>


      <div class="form-group">
        <label for="sellerCity">City</label>

        <input
          type="text"
          id="sellerCity"
          required
          placeholder="Enter city"
        >
      </div>


      <button type="submit" class="btn">
        Register Seller
      </button>

    </form>

    <div id="sellerMessage" class="message"></div>

  </section>



  <!-- ADD PRODUCT -->
  <section class="box">

    <h2>Add Product</h2>

    <form id="productForm">

      <div class="form-group">

        <label for="productName">
          Product Name
        </label>

        <input
          type="text"
          id="productName"
          required
          placeholder="Enter product name"
        >

      </div>



      <div class="form-group">

        <label for="productCategory">
          Product Category
        </label>

        <select id="productCategory" required>

          <option value="">
            Select Category
          </option>

          <option value="Water & Beverage">
            Water & Beverage
          </option>

          <option value="Plastic">
            Plastic
          </option>

          <option value="Clothing">
            Clothing
          </option>

          <option value="Electronics">
            Electronics
          </option>

          <option value="Food">
            Food
          </option>

          <option value="Other">
            Other
          </option>

        </select>

      </div>



      <div class="form-group">

        <label for="productPrice">
          Price
        </label>

        <input
          type="number"
          id="productPrice"
          min="0"
          step="0.01"
          required
          placeholder="Enter price"
        >

      </div>



      <div class="form-group">

        <label for="productUnit">
          Unit
        </label>

        <input
          type="text"
          id="productUnit"
          placeholder="Example: / Piece, / Kg, / Box"
        >

      </div>



      <div class="form-group">

        <label for="productMOQ">
          Minimum Order Quantity
        </label>

        <input
          type="number"
          id="productMOQ"
          min="1"
          value="1"
          required
        >

      </div>



      <div class="form-group">

        <label for="productDescription">
          Product Description
        </label>

        <textarea
          id="productDescription"
          placeholder="Enter product details"
        ></textarea>

      </div>



      <!-- MULTIPLE PHOTO UPLOAD -->

      <div class="form-group">

        <label for="productImages">
          Product Photos
        </label>

        <input
          type="file"
          id="productImages"
          name="images"
          accept="image/*"
          multiple
        >

        <div class="photo-info">
          You can select up to 5 photos.
        </div>

        <div id="selectedPhotos"></div>

      </div>



      <button type="submit" class="btn">
        Submit Product
      </button>

    </form>

    <div id="productMessage" class="message"></div>

  </section>

</main>



<footer>
  © 2026 VyapaarX
</footer>



<script>

  /*
   * TOKEN
   */

  const token = localStorage.getItem("vxToken");


  /*
   * SELLER REGISTRATION
   */

  document
    .getElementById("sellerForm")
    .addEventListener("submit", async function (e) {

      e.preventDefault();

      const message =
        document.getElementById("sellerMessage");

      message.style.display = "block";
      message.className = "message";
      message.textContent = "Registering seller...";


      try {

        const response = await fetch("/api/sellers", {

          method: "POST",

          headers: {
            "Content-Type": "application/json",

            ...(token
              ? {
                  Authorization:
                    "Bearer " + token
                }
              : {})
          },

          body: JSON.stringify({

            businessName:
              document
                .getElementById("businessName")
                .value
                .trim(),

            category:
              document
                .getElementById("sellerCategory")
                .value,

            city:
              document
                .getElementById("sellerCity")
                .value
                .trim()

          })

        });


        const data = await response.json();


        if (!response.ok) {

          throw new Error(
            data.message ||
            data.error ||
            "Seller registration failed"
          );

        }


        message.className =
          "message success";

        message.textContent =
          data.message ||
          "Seller registered successfully.";

        document
          .getElementById("sellerForm")
          .reset();

      }

      catch (error) {

        message.className =
          "message error";

        message.textContent =
          error.message;

      }

    });



  /*
   * SHOW SELECTED PHOTOS
   */

  document
    .getElementById("productImages")
    .addEventListener("change", function () {

      const files = this.files;

      const selected =
        document.getElementById("selectedPhotos");


      if (files.length > 5) {

        alert(
          "Maximum 5 photos allowed."
        );

        this.value = "";

        selected.textContent = "";

        return;

      }


      if (files.length === 0) {

        selected.textContent =
          "No photos selected.";

        return;

      }


      selected.textContent =
        files.length +
        " photo(s) selected.";

    });



  /*
   * ADD PRODUCT
   */

  document
    .getElementById("productForm")
    .addEventListener("submit", async function (e) {

      e.preventDefault();


      const message =
        document.getElementById("productMessage");


      message.style.display = "block";
      message.className = "message";
      message.textContent =
        "Uploading product...";


      if (!token) {

        message.className =
          "message error";

        message.textContent =
          "Please login first.";

        return;

      }


      const files =
        document
          .getElementById("productImages")
          .files;


      /*
       * MAX 5 PHOTOS
       */

      if (files.length > 5) {

        message.className =
          "message error";

        message.textContent =
          "Maximum 5 photos allowed.";

        return;

      }


      try {

        const formData =
          new FormData();


        /*
         * PRODUCT DETAILS
         */

        formData.append(
          "name",

          document
            .getElementById("productName")
            .value
            .trim()
        );


        formData.append(
          "category",

          document
            .getElementById("productCategory")
            .value
        );


        formData.append(
          "price",

          document
            .getElementById("productPrice")
            .value
        );


        formData.append(
          "unit",

          document
            .getElementById("productUnit")
            .value
            .trim()
        );


        formData.append(
          "moq",

          document
            .getElementById("productMOQ")
            .value
        );


        formData.append(
          "description",

          document
            .getElementById("productDescription")
            .value
            .trim()
        );


        /*
         * MULTIPLE IMAGES
         *
         * IMPORTANT:
         * Backend uses:
         * upload.array("images", 5)
         */

        for (
          let i = 0;
          i < files.length;
          i++
        ) {

          formData.append(
            "images",
            files[i]
          );

        }


        /*
         * SEND PRODUCT
         */

        const response =
          await fetch(
            "/api/products",
            {

              method: "POST",

              headers: {

                Authorization:
                  "Bearer " + token

              },

              body: formData

            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(

            data.message ||
            data.error ||
            "Product upload failed"

          );

        }


        message.className =
          "message success";

        message.textContent =
          data.message ||
          "Product submitted successfully. Waiting for admin approval.";


        /*
         * RESET FORM
         */

        document
          .getElementById("productForm")
          .reset();


        document
          .getElementById("selectedPhotos")
          .textContent = "";

      }


      catch (error) {

        console.error(error);


        message.className =
          "message error";

        message.textContent =
          error.message ||
          "Something went wrong.";

      }

    });

</script>

</body>
</html>

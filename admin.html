<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | VyapaarX</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="/">Vyapaar<span>X</span><small>Admin Panel</small></a><nav><a href="/">Home</a><a href="/products.html">Products</a><a href="/seller.html">Sell</a><a href="/login.html">Login</a></nav></header><main class="page"><h1>VyapaarX Admin Dashboard</h1><div id="stats" class="stats"></div><h2>Products for Approval</h2><div id="products"></div><h2>Sellers for Approval</h2><div id="sellers"></div><p class="notice">Admin API is protected by JWT. Change the default admin credentials and JWT secret before production.</p></main><script>
const token=localStorage.getItem('vxToken');const H={Authorization:'Bearer '+token,'Content-Type':'application/json'};
async function load(){let r=await fetch('/api/admin/dashboard',{headers:H});if(!r.ok){document.getElementById('stats').innerHTML='<div class="notice">Admin login required. <a href="/login.html">Login</a></div>';return}
let s=await r.json();stats.innerHTML=Object.entries(s).map(([k,v])=>`<div><b>${v}</b><small>${k}</small></div>`).join('');
r=await fetch('/api/admin/products',{headers:H});let p=await r.json();products.innerHTML='<table><tr><th>Product</th><th>Seller</th><th>Price</th><th>Status</th><th>Action</th></tr>'+p.map(x=>`<tr><td>${x.name}</td><td>${x.business_name||''}</td><td>₹${x.price}</td><td>${x.status}</td><td><button onclick="approve(${x.id},'approved')">Approve</button> <button onclick="approve(${x.id},'rejected')">Reject</button></td></tr>`).join('')+'</table>';
r=await fetch('/api/admin/sellers',{headers:H});let a=await r.json();sellers.innerHTML='<table><tr><th>Business</th><th>Category</th><th>City</th><th>Status</th><th>Action</th></tr>'+a.map(x=>`<tr><td>${x.business_name}</td><td>${x.category||''}</td><td>${x.city||''}</td><td>${x.status}</td><td><button onclick="seller(${x.id},'approved')">Approve</button> <button onclick="seller(${x.id},'rejected')">Reject</button></td></tr>`).join('')+'</table>';}
async function approve(id,status){await fetch('/api/admin/products/'+id,{method:'PATCH',headers:H,body:JSON.stringify({status})});load()}
async function seller(id,status){await fetch('/api/admin/sellers/'+id,{method:'PATCH',headers:H,body:JSON.stringify({status})});load()}
load();
</script></body></html>

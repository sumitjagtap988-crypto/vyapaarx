<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | VyapaarX</title><link rel="stylesheet" href="style.css"></head><body><main class="page"><div class="form"><h1>VyapaarX Login</h1><label>Email<input id="email" type="email"></label><label>Password<input id="password" type="password"></label><button class="btn blue" onclick="login()">Login</button><p id="msg"></p><hr><p>New buyer? Register through the API or add a registration page in the next UI pass.</p></div></main><script>
async function login(){const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const x=await r.json();msg.textContent=x.error||'Login successful';if(x.token){localStorage.setItem('vxToken',x.token);location.href='/';}}
</script></body></html>

<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Product | VyapaarX</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <style>

    .product-page {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .breadcrumb {
      margin-bottom: 20px;
      color: #666;
    }

    .breadcrumb a {
      text-decoration: none;
    }

    .productbox {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
    }

    /* PHOTO AREA */

    .photo-area {
      width: 100%;
    }

    .main-photo-box {
      width: 100%;
      height: 450px;
      border: 1px solid #ddd;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fafafa;
      overflow: hidden;
    }

    .main-photo {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .photo-placeholder {
      font-size: 100px;
    }

    .thumbnails {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .thumbnail {
      width: 75px;
      height: 75px;
      min-width: 75px;
      border: 2px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      background: #fff;
    }

    .thumbnail.active {
      border-color: #2874f0;
    }

    .thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* DETAILS */

    .product-info h1 {
      font-size: 30px;
      margin: 10px 0;
    }

    .rating-box {
      display: inline-block;
      background: #388e3c;
      color: white;
      padding: 5px 10px;
      border-radius: 5px;
      margin: 8px 0;
    }

    .price-big {
      font-size: 34px;
      font-weight: bold;
      margin: 15px 0;
    }

    .unit {
      font-size: 16px;
      font-weight: normal;
      color: #666;
    }

    .seller-box {
      background: #f7f7f7;
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
    }

    .product-description {
      line-height: 1.6;
      color: #444;
    }

    .action-buttons {
      display: flex;
      gap: 12px;
      margin-top: 25px;
    }

    .action-buttons button {
      border: none;
      padding: 15px 25px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .cart-btn {
      background: #ff9f00;
      color: white;
    }

    .buy-btn {
      background: #fb641b;
      color: white;
    }

    .whatsapp-btn {
      background: #25d366;
      color: white;
    }

    .notice {
      padding: 25px;
      background: #fff;
      border-radius: 10px;
      text-align: center;
    }

    /* MOBILE */

    @media(max-width:768px) {

      .productbox {
        grid-template-columns: 1fr;
        gap: 25px;
        padding: 15px;
      }

      .main-photo-box {
        height: 350px;
      }

      .product-info h1 {
        font-size: 24px;
      }

      .price-big {
        font-size: 28px;
      }

      .action-buttons {
        flex-direction: column;
      }

      .action-buttons button {
        width: 100%;
      }

    }

  </style>

</head>


<body>

<header>

  <a
    class="brand"
    href="/"
  >
    Vyapaar<span>X</span>

    <small>
      Business Connect. Trade. Grow.
    </small>
  </a>


  <nav>

    <a href="/">
      Home
    </a>

    <a href="/products.html">
      Products
    </a>

    <a href="/seller.html">
      Sell
    </a>

    <a href="/login.html">
      Login
    </a>

  </nav>

</header>


<main
  class="page product-page"
  id="detail"
>

  <div class="notice">
    Loading product...
  </div>

</main>


<footer>
  © 2026 VyapaarX
</footer>





<script>

async function loadProductPage() {

  const detail =
    document.getElementById("detail");

  const params =
    new URLSearchParams(
      window.location.search
    );

  const id =
    params.get("id");

  if (!id) {

    detail.innerHTML = `
      <div class="notice">

        <h2>
          Product ID missing
        </h2>

        <br>

        <a href="/products.html">
          ← Back to Products
        </a>

      </div>
    `;

    return;
  }


  try {

    const response =
      await fetch(
        "/api/products/" +
        encodeURIComponent(id)
      );


    if (!response.ok) {

      throw new Error(
        "Product not found"
      );

    }


    const p =
      await response.json();


    console.log(
      "PRODUCT:",
      p
    );


    /* =========================
       MULTIPLE IMAGES
    ========================= */

    let images = [];


    if (
      Array.isArray(p.images) &&
      p.images.length > 0
    ) {

      images =
        p.images.filter(
          img => img
        );

    }


    /* OLD MAIN IMAGE SUPPORT */

    if (
      images.length === 0 &&
      p.image
    ) {

      images = [
        p.image
      ];

    }


    /* =========================
       PHOTO HTML
    ========================= */

    let mainPhotoHTML = "";


    if (images.length > 0) {

      mainPhotoHTML = `

        <img
          id="mainProductImage"
          class="main-photo"
          src="${images[0]}"
          alt="${p.name}"
          onerror="
            this.style.display='none';
            document.getElementById('photoPlaceholder').style.display='block';
          "
        >

        <div
          id="photoPlaceholder"
          class="photo-placeholder"
          style="display:none"
        >
          ${
            p.category ===
            "Water & Beverage"
              ? "💧"
              : "🛍️"
          }
        </div>

      `;

    } else {

      mainPhotoHTML = `

        <div class="photo-placeholder">
          ${
            p.category ===
            "Water & Beverage"
              ? "💧"
              : "🛍️"
          }
        </div>

      `;

    }


    /* =========================
       THUMBNAILS
    ========================= */

    let thumbnailsHTML = "";


    images.forEach(
      (img, index) => {

        thumbnailsHTML += `

          <div
            class="thumbnail ${
              index === 0
                ? "active"
                : ""
            }"
            onclick="changeProductImage(
              '${img.replace(/'/g, "\\'")}',
              this
            )"
          >

            <img
              src="${img}"
              alt="Product photo ${index + 1}"
              onerror="
                this.parentElement.style.display='none'
              "
            >

          </div>

        `;

      }
    );


    /* =========================
       PRODUCT PAGE
    ========================= */

    detail.innerHTML = `

      <div class="breadcrumb">

        <a href="/products.html">
          Products
        </a>

        › ${p.category || ""}

        › ${p.name}

      </div>


      <div class="productbox">


        <!-- =====================
             PHOTO SECTION
        ====================== -->

        <div class="photo-area">

          <div class="main-photo-box">

            ${mainPhotoHTML}

          </div>


          <div class="thumbnails">

            ${thumbnailsHTML}

          </div>

        </div>


        <!-- =====================
             PRODUCT DETAILS
        ====================== -->

        <div class="product-info">


          <span class="tag">
            ✓ VyapaarX Product
          </span>


          <h1>
            ${p.name}
          </h1>


          <div class="rating-box">

            ★ ${p.rating || "4.4"}

          </div>


          <p>
            <strong>
              Category:
            </strong>

            ${p.category || "-"}

          </p>


          <div class="price-big">

            ₹${Number(p.price).toLocaleString("en-IN")}

            <span class="unit">
              ${p.unit || "/ Piece"}
            </span>

          </div>


          <p>

            <strong>
              Minimum Order:
            </strong>

            ${p.moq || 1}

          </p>


          <!-- SELLER -->

          <div class="seller-box">

            <strong>
              🏪 Seller
            </strong>

            <br><br>

            ${
              p.business_name ||
              "VyapaarX Seller"
            }

            ${
              p.verified
                ? " ✓ Verified"
                : ""
            }

            <br>

            📍 ${p.city || "-"}

          </div>


          <!-- DESCRIPTION -->

          <h3>
            Product Description
          </h3>


          <p class="product-description">

            ${
              p.description ||
              "Quality product listed on VyapaarX marketplace."
            }

          </p>


          <!-- FEATURES -->

          <div class="seller-box">

            🛡️ Verified Seller
            <br><br>

            🚚 Delivery Available
            <br><br>

            📲 WhatsApp Enquiry
            <br><br>

            🔒 Secure Shopping

          </div>


          <!-- BUTTONS -->

          <div class="action-buttons">


            <button
              class="cart-btn"
              onclick="addToCart(${p.id})"
            >
              🛒 Add to Cart
            </button>


            <button
              class="buy-btn"
              onclick="buyNow(${p.id})"
            >
              ⚡ Buy Now
            </button>


            <button
              class="whatsapp-btn"
              onclick="productWhatsApp(${p.id})"
            >
              WhatsApp
            </button>


          </div>


        </div>

      </div>

    `;


  } catch (error) {

    console.error(
      error
    );


    detail.innerHTML = `

      <div class="notice">

        <h2>
          Product details not found
        </h2>

        <p>
          Product ID: ${id}
        </p>

        <br>

        <a href="/products.html">
          ← Back to Products
        </a>

      </div>

    `;

  }

}


/* =========================
   CHANGE PHOTO
========================= */

function changeProductImage(
  image,
  element
) {

  const mainImage =
    document.getElementById(
      "mainProductImage"
    );

  if (!mainImage) return;


  mainImage.style.display =
    "block";


  mainImage.src =
    image;


  document
    .querySelectorAll(
      ".thumbnail"
    )
    .forEach(
      item =>
        item.classList.remove(
          "active"
        )
    );


  element.classList.add(
    "active"
  );

}


/* =========================
   ADD TO CART
========================= */

async function addToCart(id) {

  try {

    const response =
      await fetch(
        "/api/products/" +
        encodeURIComponent(id)
      );


    if (!response.ok) {

      alert(
        "Product not found."
      );

      return;

    }


    const product =
      await response.json();


    let cart =
      JSON.parse(
        localStorage.getItem(
          "vxCart"
        ) || "[]"
      );


    const existing =
      cart.find(
        item =>
          Number(item.id) ===
          Number(product.id)
      );


    if (existing) {

      existing.quantity =
        Number(
          existing.quantity || 1
        ) + 1;

    } else {

      cart.push({

        id: product.id,

        name: product.name,

        price: Number(
          product.price
        ),

        unit:
          product.unit ||
          "/ Piece",

        image:
          product.image ||
          (
            Array.isArray(
              product.images
            )
              ? product.images[0]
              : ""
          ),

        quantity: 1

      });

    }


    localStorage.setItem(
      "vxCart",
      JSON.stringify(cart)
    );


    alert(
      "✅ Product added to cart!"
    );


  } catch (error) {

    console.error(
      error
    );

    alert(
      "Could not add product to cart."
    );

  }

}


/* =========================
   BUY NOW
========================= */

async function buyNow(id) {

  await addToCart(id);

  window.location.href =
    "/cart.html";

}


/* =========================
   WHATSAPP
========================= */

async function productWhatsApp(id) {

  try {

    const response =
      await fetch(
        "/api/products/" +
        encodeURIComponent(id)
      );


    if (!response.ok) {

      alert(
        "Product not found."
      );

      return;

    }


    const p =
      await response.json();


    const text =
`Hello, I am interested in ${p.name}.

Product Price: ₹${p.price} ${p.unit || ""}

Seller: ${
  p.business_name ||
  "VyapaarX Seller"
}

MOQ: ${p.moq || 1}

Please share product details and availability.`;


    window.open(
      "https://wa.me/917045047906?text=" +
      encodeURIComponent(text),
      "_blank"
    );


  } catch (error) {

    console.error(
      error
    );

    alert(
      "Could not open WhatsApp."
    );

  }

}


/* =========================
   PAGE LOAD
========================= */

document.addEventListener(
  "DOMContentLoaded",
  function () {

    loadProductPage();

  }
);

</script>

</body>
</html>
